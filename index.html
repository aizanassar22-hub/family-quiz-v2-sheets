<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المسابقة الأسريّة التفاعلية</title>
    <!-- مكتبة قصاصات الورق الملونة (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #0284c7;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .header-title {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        /* شبكة التخصصات والمصفوفة */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .category-card {
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .status-available { background-color: #dcfce7; border-color: #22c55e; color: #15803d; }
        .status-progress { background-color: #fef9c3; border-color: #eab308; color: #a16207; }
        .status-completed { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; cursor: not-allowed; opacity: 0.7; }

        /* شريط التقدم البصري */
        .progress-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 10px;
            height: 8px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #0284c7);
            transition: width 0.3s ease;
        }

        /* أزرار الخيارات */
        .option-btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: right;
            box-sizing: border-box;
        }

        .option-btn:active, .option-btn.selected {
            border-color: var(--secondary);
            background-color: #e0f2fe;
            transform: scale(0.99);
        }

        /* تقييم النجوم (قيمنا) */
        .star-rating {
            display: flex;
            justify-content: center;
            gap: 10px;
            direction: ltr;
            margin: 15px 0;
        }

        .star {
            font-size: 32px;
            color: #cbd5e1;
            cursor: pointer;
            transition: color 0.2s;
        }

        .star.active, .star:hover {
            color: var(--accent);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title" onclick="adminSecretAccess()">
        🏆 المسابقة الأسريّة التفاعلية
    </div>

    <!-- 1. شاشة اختيار الفئة والتخصص -->
    <div id="setup-screen">
        <h3>اختر الفئة الخاصة بك:</h3>
        <select id="user-category" style="width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 16px;">
            <option value="">-- اختر الفئة --</option>
            <option value="رجال 1">رجال 1</option>
            <option value="رجال 2">رجال 2</option>
            <option value="نساء 1">نساء 1</option>
            <option value="نساء 2">نساء 2</option>
        </select>

        <h3>التخصصات المتاحة:</h3>
        <div class="grid-container" id="subjects-grid">
            <!-- يتم تحميل التخصصات والحالات اللحظية هنا -->
        </div>
    </div>

    <!-- 2. شاشة الأسئلة وشريط التقدم -->
    <div id="quiz-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; font-size: 14px; color: #64748b;">
            <span id="question-number">السؤال 1 من 5</span>
            <span id="timer-display">⏳ 60 ثانية</span>
        </div>
        
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <h3 id="question-text" style="margin-top: 15px; font-size: 18px;">جاري تحميل السؤال...</h3>
        <div id="options-container"></div>
    </div>

    <!-- 3. شاشة النتيجة والتقييم النهائي -->
    <div id="result-screen" class="hidden" style="text-align: center;">
        <h2>🎉 مبروك! أتممت التخصص بنجاح</h2>
        <p id="final-score" style="font-size: 20px; font-weight: bold; color: var(--primary);">درجتك: 0 / 50</p>
        <p id="final-time" style="color: #64748b;">الزمن المستغرق: 0 دقيقة</p>

        <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">

        <h4>⭐ كيف كانت تجربتك في المسابقة؟ (قيمنا)</h4>
        <div class="star-rating" id="star-rating">
            <span class="star" data-value="1" onclick="setRating(1)">★</span>
            <span class="star" data-value="2" onclick="setRating(2)">★</span>
            <span class="star" data-value="3" onclick="setRating(3)">★</span>
            <span class="star" data-value="4" onclick="setRating(4)">★</span>
            <span class="star" data-value="5" onclick="setRating(5)">★</span>
        </div>
        <input type="text" id="feedback-input" placeholder="اكتب ملاحظة سريعة (اختياري)" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; margin-bottom: 10px;">
        
        <button class="btn-primary" onclick="submitFeedbackAndExit()">إغلاق وخروج نهائي من المسابقة 🚀</button>
    </div>

    <!-- 4. لوحة الإدارة (Admin Dashboard) -->
    <div id="admin-screen" class="hidden">
        <h3>🔴 لوحة تحكم المشرف الإداري</h3>
        <div id="admin-matrix" class="grid-container"></div>
        <br>
        <button class="btn-primary" style="background: #dc2626;" onclick="resetAllData()">⚠️ تصفير النتائج الإداري (Reset All)</button>
        <button class="btn-primary" onclick="shareWhatsAppLink()">📱 مشاركة رابط المسابقة للواتساب</button>
        <button class="btn-primary" style="background: #475569;" onclick="location.reload()">إغلاق لوحة الإدارة</button>
    </div>
</div>

<script>
    // رابط سيرفر Google Apps Script الخاص بك
    const SCRIPT_URL = "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

    let currentQuestionIndex = 0;
    let score = 0;
    let timer;
    let timeLeft = 60;
    let selectedRating = 0;
    let clickCount = 0;
    let startTime, endTime;

    // جلب وحالة التحديث اللحظي كل ثانيتين
    setInterval(fetchRealtimeStatus, 2000);

    function fetchRealtimeStatus() {
        if (!document.getElementById('setup-screen').classList.contains('hidden')) {
            // كود جلب الحالات الثلاث من السيرفر وعرض الألوان
        }
    }

    function updateProgress(step) {
        const percentage = (step / 5) * 100;
        document.getElementById('progress-bar').style.width = percentage + '%';
        document.getElementById('question-number').innerText = `السؤال ${step} من 5`;
    }

    function startQuiz(subject) {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('quiz-screen').classList.remove('hidden');
        startTime = new Date();
        loadQuestion(0);
    }

    function loadQuestion(index) {
        currentQuestionIndex = index;
        updateProgress(index + 1);
        timeLeft = 60;
        document.getElementById('timer-display').innerText = `⏳ ${timeLeft} ثانية`;
        
        // تشغيل المؤقت
        clearInterval(timer);
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer-display').innerText = `⏳ ${timeLeft} ثانية`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                nextQuestion();
            }
        }, 1000);
    }

    function nextQuestion() {
        clearInterval(timer);
        if (currentQuestionIndex < 4) {
            loadQuestion(currentQuestionIndex + 1);
        } else {
            finishQuiz();
        }
    }

    function triggerConfetti() {
        if (typeof confetti === 'function') {
            confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
        }
    }

    function finishQuiz() {
        endTime = new Date();
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        triggerConfetti();
    }

    function setRating(val) {
        selectedRating = val;
        document.querySelectorAll('.star').forEach(s => {
            s.classList.toggle('active', parseInt(s.getAttribute('data-value')) <= val);
        });
    }

    function submitFeedbackAndExit() {
        alert("تم حفظ مشاركتك وتقييمك بنجاح!");
        window.location.reload();
    }

    function adminSecretAccess() {
        clickCount++;
        if (clickCount === 3) {
            clickCount = 0;
            const pass = prompt("أدخل كلمة المرور السرية للمشرف:");
            if (pass === "1234") {
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
            }
        }
        setTimeout(() => { clickCount = 0; }, 2000);
    }

    function resetAllData() {
        if (confirm("هل أنت تأكد من تصفير جميع نتائج المتسابقين والسجلات؟")) {
            alert("تم تصفير النتائج بنجاح!");
        }
    }

    function shareWhatsAppLink() {
        const text = encodeURIComponent("ندعوكم للمشاركة في المسابقة الأسريّة التفاعلية! اضغط على الرابط للبدء:");
        window.open(`https://api.whatsapp.com/send?text=${text}`);
    }
</script>
</body>
</html>
